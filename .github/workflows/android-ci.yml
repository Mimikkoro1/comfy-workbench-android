name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Override Windows-only java.home
        # 用户级 gradle.properties 优先于项目级，覆盖写死的 E:\ 路径
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
      - name: Install SDK platform
        # 包名按本机 SDK 的 package.xml 实际 path：compileSdk 37 对应 platforms;android-37.0；build-tools 36.0.0 即 AGP 9.1.1 本地实际使用版本
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build release APK (debug-signed when no keystore)
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
